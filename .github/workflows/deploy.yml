name: Deploy Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker API image
        run: |
          docker build -t customer-analytics-api:latest -f docker/Dockerfile .

      - name: Build Docker Streamlit image
        run: |
          docker build -t customer-analytics-app:latest -f docker/Dockerfile.streamlit .
