name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # Let both Python versions run independently
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Create required directories
        run: |
          mkdir -p data/raw data/interim data/processed data/external
          mkdir -p models monitoring reports/figures mlruns

      - name: Verify project structure (Phase 0 check)
        run: |
          python -c "
          from pathlib import Path
          required = [
            'src/api/main.py', 'src/api/schemas.py', 'src/api/dependencies.py',
            'src/api/routes/churn.py', 'src/api/routes/segment.py',
            'src/api/routes/recommend.py', 'src/api/routes/forecast.py',
            'src/models/registry.py', 'src/models/predict.py',
            'src/evaluation/explainability.py',
            'src/utils/logger.py',
            'configs/config.yaml', 'configs/model_params.yaml',
            'README.md', 'requirements.txt',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              print('MISSING FILES:', missing)
              raise SystemExit(1)
          print('All required files present.')
          "

      - name: Check all src modules import cleanly (Phase 0 check)
        run: |
          python -c "
          import src.utils.logger
          import src.api.schemas
          import src.models.registry
          print('All core modules importable without errors.')
          "

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            -p no:warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: reports/coverage.xml
