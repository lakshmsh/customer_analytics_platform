services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Machine Learning Serving Layer
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: customer_analytics_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - analytics-net

  # ---------------------------------------------------------------------------
  # 2. Streamlit Multi-Page Executive Decision Dashboard
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: customer_analytics_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - analytics-net

networks:
  analytics-net:
    driver: bridge
